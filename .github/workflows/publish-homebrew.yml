name: Publish Homebrew

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-config:
    name: Read CI Config
    runs-on: ubuntu-latest
    outputs:
      enable_homebrew_publish: ${{ steps.config.outputs.enable_homebrew_publish }}
      homebrew_environment: ${{ steps.config.outputs.homebrew_environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export Config To GitHub Output
        id: config
        run: make ci-export-config

  publish:
    name: Publish To Homebrew Tap
    needs: ci-config
    if: needs.ci-config.outputs.enable_homebrew_publish == '1'
    runs-on: ubuntu-latest
    environment: ${{ needs.ci-config.outputs.homebrew_environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true

      - name: Setup CI Environment
        run: make ci-setup

      - name: Generate Homebrew Formula
        run: make ci-generate-homebrew-formula

      - name: Publish Formula To Tap
        run: make ci-publish-homebrew
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
