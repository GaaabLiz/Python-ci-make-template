name: Publish WinGet

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-config:
    name: Read CI Config
    runs-on: ubuntu-latest
    outputs:
      enable_winget_publish: ${{ steps.config.outputs.enable_winget_publish }}
      winget_environment: ${{ steps.config.outputs.winget_environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export Config To GitHub Output
        id: config
        run: make ci-export-config

  publish:
    name: Publish To WinGet
    needs: ci-config
    if: needs.ci-config.outputs.enable_winget_publish == '1'
    runs-on: windows-latest
    environment: ${{ needs.ci-config.outputs.winget_environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Make
        run: choco install make

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true

      - name: Setup CI Environment
        run: make ci-setup

      - name: Build Windows Assets
        run: make ci-build-winget-assets

      - name: Generate WinGet Manifests
        run: make ci-generate-winget-manifests

      - name: Validate WinGet Manifests
        run: make ci-validate-winget-manifests

      - name: Publish WinGet Pull Request
        run: make ci-publish-winget
        env:
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}