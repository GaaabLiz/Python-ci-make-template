name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-build:
    name: Quality And Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true

      - name: Setup CI Environment
        run: make ci-setup

      - name: Print CI Configuration
        run: make ci-log-config

      - name: Run Static Quality Gates
        run: make ci-quality

      - name: Run Automated Tests
        run: make ci-test

      - name: Build Package
        run: make build

      - name: Inspect Build Artifacts
        run: make ci-list-build-artifacts

