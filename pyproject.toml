[project]
name = "python-ci-make-template"
version = "0.0.2"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "packaging>=24.2",
]

[project.scripts]
myapp = "myapp.cli:main"

[project.urls]
Repository = "https://github.com/GaaabLiz/Python-ci-make-template"

[tool.python-ci-make-template.auto-update]
enabled = true
strategies = { default = "pip" }
asset-patterns = { default = "python_ci_make_template-*.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["myapp"]


[dependency-groups]
dev = [
	"ty",
	"pdoc",
	"pytest",
	"pytest-cov",
	"ruff",
	"cairosvg>=2.7",
	"pillow>=10.0",
	"svglib>=1.5",
	"reportlab>=4.0",
	"skia-python>=87.6",
]

