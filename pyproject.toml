[project]
name = "python-ci-make-template"
version = "0.0.2"
description = "A reusable Makefile and GitHub Actions template for Python projects managed with uv."
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["myapp"]


[dependency-groups]
dev = [
	"ty",
	"pdoc",
	"pytest",
	"pytest-cov",
	"ruff",
	"pillow>=10.0",
	"skia-python>=87.6",
]

