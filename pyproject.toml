[project]
name = "python-ci-make-template"
version = "0.0.2"
description = "A reusable Makefile and GitHub Actions template for Python projects managed with uv."
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["myapp"]


[dependency-groups]
dev = [
	"pytest",
	"pytest-cov",
	"ruff",
]
build = [
	"pyinstaller",
]
typing = [
	"ty",
]
docs = [
	"pdoc",
]
graphics = [
	"cairosvg>=2.7",
	"pillow>=10.0",
	"svglib>=1.5",
	"reportlab>=4.0",
	"skia-python>=87.6",
]

